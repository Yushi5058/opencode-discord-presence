name: Publish to npm

# Publishes @yushi_61/opencode-discord-presence with npm Trusted Publishing
# (OIDC) — no NPM_TOKEN secret involved.
#
# Requires a trusted publisher on npmjs.com for this package:
#   Publisher:      GitHub Actions
#   Organization:   Yushi5058
#   Repository:     opencode-discord-presence
#   Workflow name:  publish.yml
#   Environment:    (none)
#
# Release flow: bump the version in package.json, tag it, create a GitHub
# release, and this workflow publishes that version (with provenance).

on:
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required by Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # No `registry-url` here: it makes setup-node write a placeholder
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc.
      # Harmless (npm falls back to OIDC when the token is empty) but
      # pointless — the default registry is registry.npmjs.org anyway.
      - name: Setup Node.js (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require npm with trusted publishing support (>= 11.5.1)
        run: |
          npm install -g npm@latest
          node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (v[0]<11 || (v[0]===11 && v[1]<5)) { console.error('npm too old: '+v.join('.')); process.exit(1) } console.log('npm', v.join('.'))"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish to npm (Trusted Publishing, OIDC + provenance)
        run: npm publish --access public
